# .github/workflows/cd.yml
name: CD
on:
  push:
    branches: [master]

env:
  TEST_TAG: ${{ secrets.DOCKER_REPO }}:test
  LATEST_TAG: ${{ secrets.DOCKER_REPO }}:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: ${{ env.TEST_TAG }}

      # -------------------------
      # Test Docker container
      # -------------------------

      - name: Run container
        run: |
          docker run -d \
            --name nest-test \
            -p 3000:3000 \
            ${{ env.TEST_TAG }}

      - name: Test container
        run: |
          sleep 5
          curl --fail http://localhost:3000

      - name: Stop container
        if: always()
        run: |
          docker stop nest-test || true
          docker rm nest-test || true

      # -------------------------
      # Production image
      # -------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.LATEST_TAG }}
      # ${{ env.SHA_TAG }}