name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]


jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test
        env:
          NODE_ENV: ${{github.env.DEV_ENV.NODE_ENV_TEST}}
